# markdownlint 配置。
# 动机说明：
# - MD013（line-length）放宽到 240：对齐 prettier printWidth 100 的宽松度，
#   中文文档长行是常态，逐行断行反而破坏可读性。
#   其余规则保持默认，中文文档同样适用（列表缩进、标题层级等）。
# - 检查范围：全仓 .md（docs/ 方案文档、README、AGENTS.md 等），
#   排除构建产物（out/dist/release）、app-config（含 API 密钥的私有配置）与
#   .zcode/（ZCode 本地计划文件，已在 .gitignore）。

config:
  MD013:
    line_length: 240
    # 表格行无法断行（单元格语义依赖单行），不检查
    tables: false

globs:
  - '**/*.md'
  - '!**/node_modules/**'
  - '!**/out/**'
  - '!**/dist/**'
  - '!**/release/**'
  - '!**/app-config/**'
  - '!DEPLOYMENT.local.md'
  - '!.zcode/**'
